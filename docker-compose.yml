services:
  postgres:
    image: postgres:16-alpine
    container_name: echogpt-postgres
    restart: always
    environment:
      POSTGRES_USER: echogpt_user
      POSTGRES_PASSWORD: echogpt_password
      POSTGRES_DB: echogpt_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
